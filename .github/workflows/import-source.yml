name: Import prepared source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ hashFiles('vpn-bot-source.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified source
        run: |
          unzip -o vpn-bot-source.zip
          python - <<'PY'
          from pathlib import Path
          for name in ('vpn-bot-source.zip', '.github/workflows/import-source.yml'):
              Path(name).unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish configurable VPN bot source"
          git push
